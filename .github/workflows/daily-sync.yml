name: 每日两次同步官方通知

on:
  schedule:
    # 每小时整点（UTC 整点 = 北京整点）跑一次；内容没变化就不会产生提交
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      POCKETBAY_TOKEN: ${{ secrets.POCKETBAY_TOKEN }}
      POCKETBAY_PROJECT: "3681"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取官方页面
        run: python scraper/scrape.py

      - name: 生成静态页面
        run: python tools/build_page.py

      # 线上已经是同一份内容（同样的 build + data 指纹）就整轮跳过，避免每小时刷提交
      - name: 判断是否需要发布
        id: gate
        run: |
          set +e
          python tools/should_publish.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "need=0" >> "$GITHUB_OUTPUT"
            echo "线上内容一致，本轮不发布"
          else
            echo "need=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.gate.outputs.need == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 同步官方通知 $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git push
          fi

      # 云端发布到 PocketBay：本机不开机也能更新（无需本机计划任务）
      - name: 发布到 PocketBay
        if: steps.gate.outputs.need == '1' && env.POCKETBAY_TOKEN != ''
        continue-on-error: true
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('pocketbay.zip','w',zipfile.ZIP_DEFLATED); z.write('index.html'); z.close(); print('zip ok')"
          curl -sS --retry 3 --max-time 60 -X POST \
            -H "Authorization: Bearer $POCKETBAY_TOKEN" \
            -F "file=@pocketbay.zip" \
            "https://pocketbay.com/api/projects/$POCKETBAY_PROJECT/deploy" -o deploy.json
          cat deploy.json
          for i in $(seq 1 20); do
            sleep 6
            curl -sS --retry 3 --max-time 60 -H "Authorization: Bearer $POCKETBAY_TOKEN" \
              "https://pocketbay.com/api/projects/$POCKETBAY_PROJECT/deploy/status" -o status.json
            python -c "import json,sys; d=json.load(open('status.json')); print('status=%s phase=%s stage=%s' % (d.get('status'), d.get('phase'), '>'.join(d.get('stage_events') or []))); sys.exit(0 if d.get('phase')=='success' else 1)" && { echo "POCKETBAY_DEPLOY_OK"; break; } || true
          done
